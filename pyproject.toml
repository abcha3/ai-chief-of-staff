[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-daily-report"
version = "0.1.0"
description = "AI work daily/weekly report generator — summarize what ALL AI agents on your machine did today: local, read-only, evidence-backed"
readme = "README.en.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ai-daily-report contributors" }]
keywords = ["ai", "agents", "daily-report", "weekly-report", "work-report", "activity-log", "vibe-coding", "observability", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/abcha3/ai-daily-report"

[project.scripts]
aicos = "aicos:main"

[tool.setuptools]
py-modules = ["aicos", "aicos_html"]
