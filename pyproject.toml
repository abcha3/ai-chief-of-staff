[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chief-of-staff"
version = "0.1.0"
description = "Summarize what ALL AI agents on your machine did today — local, read-only, evidence-backed daily reports"
readme = "README.en.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "ai-chief-of-staff contributors" }]
keywords = ["ai", "agents", "daily-report", "vibe-coding", "observability", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/abcha3/ai-chief-of-staff"

[project.scripts]
aicos = "aicos:main"

[tool.setuptools]
py-modules = ["aicos", "aicos_html"]
